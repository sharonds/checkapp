# Dependabot configuration for sharonds/checkapp
# Docs: https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  # CLI / root package
  - package-ecosystem: "npm"
    # Version-update PRs off: each PR runs paid CI and review. Vulnerabilities
    # still raise Dependabot alerts (email); fix those by hand in a normal PR.
    open-pull-requests-limit: 0
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Amsterdam"
    labels:
      - "dependencies"
      - "cli"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  # Dashboard (Next.js)
  - package-ecosystem: "npm"
    # Version-update PRs off: each PR runs paid CI and review. Vulnerabilities
    # still raise Dependabot alerts (email); fix those by hand in a normal PR.
    open-pull-requests-limit: 0
    directory: "/dashboard"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Amsterdam"
    labels:
      - "dependencies"
      - "dashboard"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    # Version-update PRs off: each PR runs paid CI and review. Vulnerabilities
    # still raise Dependabot alerts (email); fix those by hand in a normal PR.
    open-pull-requests-limit: 0
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Amsterdam"
    labels:
      - "dependencies"
      - "ci"
    commit-message:
      prefix: "ci(deps)"
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
