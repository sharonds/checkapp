name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install CLI dependencies
        run: bun install --frozen-lockfile

      - name: Install dashboard dependencies
        run: cd dashboard && bun install --frozen-lockfile

      - name: Check registry drift
        run: bun run check:registry

      - name: Check docs contracts
        run: bun run check:docs

      - name: Check npm package surface
        run: bun run check:package

      - name: Run CLI tests
        run: bun run test

      - name: Run dashboard tests
        run: cd dashboard && bunx vitest run

      - name: Typecheck dashboard
        run: cd dashboard && bunx tsc --noEmit --pretty false

      - name: Build dashboard
        run: cd dashboard && bun run build

      - name: Install agent-browser
        run: npm install -g agent-browser@0.26.0 && agent-browser install

      - name: Run production browser E2E lane
        run: bun run test:e2e:browser:prod
        timeout-minutes: 5

      - name: Run browser E2E lane
        run: bun run test:e2e:browser
        timeout-minutes: 5

      - name: Build CLI binaries
        run: bash build.sh

  package-smoke-windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install CLI dependencies
        run: bun install --frozen-lockfile

      - name: Run package surface tests
        run: bun test scripts/check-package-surface.test.ts

      - name: Check npm package surface
        run: bun run check:package
